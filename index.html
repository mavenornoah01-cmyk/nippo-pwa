<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日報メモ">
  <title>日報メモ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #0d1117; }
    body { -webkit-font-smoothing: antialiased; }

    .container {
      min-height: 100vh;
      background: linear-gradient(180deg, #0d1117, #161b22);
      color: #e6edf3;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', -apple-system, sans-serif;
      padding-bottom: 100px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(20px, calc(env(safe-area-inset-top) + 8px)) 20px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header.row {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
    .date-label {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    .subtitle {
      font-size: 12px;
      color: #8b949e;
      margin-top: 2px;
      letter-spacing: 2px;
    }
    .gear-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn {
      background: none;
      border: none;
      color: #6db3f2;
      font-size: 15px;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Sleep row ─── */
    .sleep-row {
      display: flex;
      gap: 10px;
      padding: 16px 20px 4px;
      flex-wrap: wrap;
    }
    .sleep-btn {
      flex: 1;
      min-width: 120px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #e6edf3;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sleep-time {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .sleep-dur {
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }

    /* ─── Summary bar ─── */
    .summary-bar {
      display: flex;
      margin: 16px 20px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .summary-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      font-size: 11px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
    }

    /* ─── Entry list ─── */
    .list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .empty {
      text-align: center;
      color: #8b949e;
      padding: 40px 0;
      font-size: 15px;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-time {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-content {
      font-size: 14px;
      line-height: 1.5;
      color: #cdd6e0;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
    }
    .mini-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 8px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Bottom bar ─── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #0d1117 30%);
    }
    .export-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e6edf3;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .add-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2d5a8e, #1a6dd5);
      border: none;
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(26,109,213,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    /* ─── Form ─── */
    .form { padding: 16px 20px 0; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sel {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #e6edf3;
      font-size: 16px;
      font-weight: 600;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
      font-family: inherit;
    }
    .textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #e6edf3;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    .save-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 24px auto 0;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2d5a8e, #1a6dd5);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dur-display {
      font-size: 13px;
      color: #6db3f2;
      margin-top: 4px;
      text-align: right;
    }

    /* ─── Export ─── */
    .preview {
      margin: 16px 20px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #cdd6e0;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'SF Mono', 'Menlo', monospace;
      max-height: 60vh;
    }

    /* ─── Tabs ─── */
    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: #8b949e;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .tab.on {
      background: rgba(109,179,242,0.15);
      color: #6db3f2;
      border-color: rgba(109,179,242,0.3);
    }

    /* ─── Timeline ─── */
    .tl-wrap {
      position: relative;
      margin: 8px 16px 0;
    }
    .tl-row {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      pointer-events: none;
    }
    .tl-label {
      width: 44px;
      text-align: right;
      padding-right: 8px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .tl-line {
      flex: 1;
      height: 1px;
    }
    .tl-block {
      position: absolute;
      left: 52px;
      right: 4px;
      border-radius: 5px;
      padding: 3px 7px;
      overflow: hidden;
      cursor: pointer;
      box-sizing: border-box;
    }
    .tl-block-title {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tl-block-sub {
      font-size: 10px;
      opacity: 0.65;
      line-height: 1.2;
    }

    /* ─── Settings ─── */
    .group {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      font-size: 13px;
      color: #cdd6e0;
    }
    .chip-x {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      margin-left: 2px;
    }
    .add-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.15);
      color: #8b949e;
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .inline-in {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #e6edf3;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .inline-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: rgba(109,179,242,0.2);
      color: #6db3f2;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ─── Constants ───
    const DEFAULT_CATEGORIES = {
      仕事: ['商談', 'MTG', '事務作業', 'PC業務', '自己研鑽'],
      私用: ['趣味', '家族'],
      移動: ['船', 'バス', '電車', '車'],
      生活: ['食事', '入浴', '休憩', '家事'],
    };

    const DEFAULT_PRESETS = {
      生活: {
        食事: ['朝食', '昼食', '夕食', '間食'],
        入浴: ['シャワー', '風呂掃除'],
        休憩: ['仮眠', '読書', 'SNS'],
        家事: ['洗濯', '掃除', '料理', '買い物'],
      },
      仕事: {
        商談: [],
        MTG: ['定例', '臨時'],
        事務作業: ['書類作成', '経費精算'],
        PC業務: ['SNS投稿作成', 'メール対応', '資料作成'],
        自己研鑽: ['読書', '動画学習', 'Chess'],
      },
      私用: {
        趣味: ['麻雀', 'Chess', '読書', 'ゲーム'],
        家族: [],
      },
      移動: {
        船: ['魚島→今治', '今治→魚島'],
        バス: [],
        電車: [],
        車: [],
      },
    };

    const CATEGORY_COLORS = {
      仕事: { text: '#6db3f2', accent: '#2d5a8e' },
      私用: { text: '#c49bff', accent: '#5a3580' },
      移動: { text: '#6dd5a0', accent: '#2d7050' },
      生活: { text: '#f2c46d', accent: '#806030' },
    };

    const FALLBACK_COLORS = [
      { text: '#6dd5d5', accent: '#2d7070' },
      { text: '#f26db3', accent: '#802d5a' },
      { text: '#b3f26d', accent: '#5a802d' },
    ];

    const timeSlots = [];
    for (let h = 0; h < 24; h++) {
      for (let m = 0; m < 60; m += 15) {
        timeSlots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
      }
    }
    // 終了時間用: 通常 + 翌0:00〜翌5:00
    const endTimeSlots = [...timeSlots];
    for (let h = 24; h <= 29; h++) {
      for (let m = 0; m < 60; m += 15) {
        endTimeSlots.push(`${h}:${String(m).padStart(2,'0')}`);
        if (h === 29 && m === 0) break; // 翌5:00で終了
      }
    }

    // ─── Helpers ───
    function getCatColor(cat) {
      if (CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
      let hash = 0;
      for (let i = 0; i < cat.length; i++) hash = cat.charCodeAt(i) + ((hash << 5) - hash);
      return FALLBACK_COLORS[Math.abs(hash) % FALLBACK_COLORS.length];
    }

    function roundToQuarter() {
      const d = new Date();
      const m = d.getMinutes();
      const rounded = Math.round(m / 15) * 15;
      const h = d.getHours() + (rounded === 60 ? 1 : 0);
      return `${String(h % 24).padStart(2,'0')}:${String(rounded % 60).padStart(2,'0')}`;
    }

    function roundToQuarterDatetime() {
      const d = new Date();
      const m = d.getMinutes();
      const rounded = Math.round(m / 15) * 15;
      const overflow = rounded === 60;
      const date = new Date(d);
      if (overflow) date.setMinutes(0), date.setHours(date.getHours() + 1);
      else date.setMinutes(rounded);
      const yy = date.getFullYear();
      const mo = String(date.getMonth() + 1).padStart(2,'0');
      const dd = String(date.getDate()).padStart(2,'0');
      const hh = String(date.getHours()).padStart(2,'0');
      const mm = String(date.getMinutes()).padStart(2,'0');
      return `${yy}-${mo}-${dd}T${hh}:${mm}`;
    }

    // 日時文字列 or 時刻文字列から表示用時刻を取得
    function fmtTimeDisplay(t) {
      if (!t) return '--:--';
      if (t.includes('T')) return t.slice(11, 16); // "2026-05-03T07:00" → "07:00"
      return t;
    }

    // 睡眠時間計算: 日時文字列対応
    function sleepDiff(sleepVal, wakeVal) {
      if (!sleepVal || !wakeVal) return 0;
      if (sleepVal.includes('T') && wakeVal.includes('T')) {
        return Math.round((new Date(wakeVal) - new Date(sleepVal)) / 60000);
      }
      return timeDiff(sleepVal, wakeVal);
    }

    // 時刻表示: 24:xx〜29:xx を「翌H:MM」に変換
    function fmtTime(t) {
      if (!t) return '--:--';
      const [h, m] = t.split(':').map(Number);
      if (h >= 24) return `翌${h - 24}:${String(m).padStart(2,'0')}`;
      return t;
    }

    // 開始時刻に15分加算した終了時刻デフォルト
    function defaultEndTime(start) {
      const [h, m] = start.split(':').map(Number);
      const total = h * 60 + m + 15;
      return `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
    }

    function timeDiff(start, end) {
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let d = eh * 60 + em - (sh * 60 + sm);
      if (d < 0) d += 1440;
      return d;
    }

    function fmtDur(min) {
      return `${Math.floor(min / 60)}時間${String(min % 60).padStart(2,'0')}分`;
    }

    function getToday() {
      const d = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const pad = n => String(n).padStart(2, '0');
      return {
        key: `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`,
        display: `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}（${days[d.getDay()]}）`,
      };
    }

    function load(k, fb) {
      try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }
      catch { return fb; }
    }

    function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escAttr(s) {
      return String(s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ─── App State ───
    const today = getToday();

    let S = {
      view: 'main',
      editIdx: null,
      data: load(`nippo_${today.key}`, { entries: [], wakeUp: null, sleep: null }),
      cats: load('nippo_cats', DEFAULT_CATEGORIES),
      presets: load('nippo_presets', DEFAULT_PRESETS),
    };

    let F = {};         // view-specific form state
    let _exportMd = ''; // cached MD text for copy/share
    let mainTab = 'list'; // 'list' | 'timeline'

    function persist() {
      save(`nippo_${today.key}`, S.data);
      save('nippo_cats', S.cats);
      save('nippo_presets', S.presets);
    }

    // ─── Form State Initializers ───
    function initFormAdd() {
      const majors = Object.keys(S.cats);
      const entry = S.editIdx !== null ? S.data.entries[S.editIdx] : null;
      const maj = entry?.major || majors[0];
      F = {
        start: entry?.start || roundToQuarter(),
        end: entry?.end || defaultEndTime(entry?.start || roundToQuarter()),
        major: maj,
        minor: entry?.minor || S.cats[maj]?.[0] || '',
        mode: 'preset',
        presetVal: '',
        customVal: entry?.content || '',
        askAdd: false,
      };
      // Determine correct mode for edit
      if (entry?.content) {
        const p = S.presets[entry.major]?.[entry.minor] || [];
        if (p.includes(entry.content)) {
          F.mode = 'preset';
          F.presetVal = entry.content;
          F.customVal = '';
        } else {
          F.mode = 'custom';
        }
      }
    }

    function initFormSettings() {
      const firstMaj = Object.keys(S.cats)[0] || '';
      F = {
        tab: 'cat',
        newMaj: '',
        addMinTgt: null,
        newMinVal: '',
        pMaj: firstMaj,
        pMin: S.cats[firstMaj]?.[0] || '',
        newPre: '',
      };
    }

    // ─── Render ───
    function render() {
      const app = document.getElementById('app');
      let html = '';
      if (S.view === 'main')         html = renderMain();
      else if (S.view === 'add')     html = renderAdd();
      else if (S.view === 'export')  html = renderExport();
      else if (S.view === 'settings') html = renderSettings();
      app.innerHTML = `<div class="container">${html}</div>`;
      postRender();
    }

    function postRender() {
      document.querySelectorAll('[data-ime]').forEach(el => {
        let composing = false;
        el.addEventListener('compositionstart', () => composing = true);
        el.addEventListener('compositionend', () => composing = false);
        el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' && !composing) {
            ev.preventDefault();
            const act = el.dataset.enterAction;
            const maj = el.dataset.maj;
            if (act === 'add-major') addMajor();
            else if (act === 'add-minor') addMinor(maj);
            else if (act === 'add-preset') addPreset();
          }
        });
      });
      // Focus the newly shown minor-add input
      const minInput = document.querySelector('[name="newMinVal"]');
      if (minInput && F.addMinTgt) minInput.focus();
    }

    // ─── View: Main ───
    function renderMain() {
      const total = S.data.entries.reduce((acc, e) => acc + timeDiff(e.start, e.end), 0);
      const summary = {};
      S.data.entries.forEach(e => {
        summary[e.major] = (summary[e.major] || 0) + timeDiff(e.start, e.end);
      });
      const sorted = [...S.data.entries].sort((a, b) => a.start.localeCompare(b.start));

      // Summary bar
      let summaryBarHtml = '';
      if (sorted.length > 0) {
        const segs = Object.entries(summary).map(([cat, mins]) => {
          const pct = (mins / total) * 100;
          const c = getCatColor(cat);
          const label = pct > 15 ? `${cat} ${fmtDur(mins)}` : cat;
          return `<div class="summary-seg" style="flex:0 0 ${pct}%;background:${c.accent};color:${c.text}">${label}</div>`;
        }).join('');
        summaryBarHtml = `<div class="summary-bar">${segs}</div>`;
      }

      // Entry cards
      let listHtml = '';
      if (sorted.length === 0) {
        listHtml = `
          <div class="empty">
            <div style="font-size:32px;margin-bottom:8px">📝</div>

          </div>`;
      } else {
        sorted.forEach(e => {
          const c = getCatColor(e.major);
          const oi = S.data.entries.indexOf(e);
          listHtml += `
            <div class="card" style="border-left:3px solid ${c.text}">
              <div class="card-top">
                <span class="card-time">${escHtml(fmtTime(e.start))}–${escHtml(fmtTime(e.end))}</span>
                <span class="badge" style="background:${c.accent};color:${c.text}">${escHtml(e.major)}›${escHtml(e.minor)}</span>
              </div>
              ${e.content ? `<div class="card-content">${escHtml(e.content)}</div>` : ''}
              <div class="card-meta">
                <span>${fmtDur(timeDiff(e.start, e.end))}</span>
                <div>
                  <button class="mini-btn" data-action="edit-entry" data-idx="${oi}">編集</button>
                  <button class="mini-btn" style="color:#f27066" data-action="del-entry" data-idx="${oi}">削除</button>
                </div>
              </div>
            </div>`;
        });
      }

      // Sleep buttons
      const wakeBg = S.data.wakeUp
        ? 'linear-gradient(135deg,#2d5a3e,#1a3a28)'
        : 'linear-gradient(135deg,#3a6b4a,#2d5a3e)';
      const wakeShadow = S.data.wakeUp ? '' : 'box-shadow:0 2px 12px rgba(109,213,160,0.2);';
      const sleepBg = S.data.sleep
        ? 'linear-gradient(135deg,#2d2a5a,#1a1838)'
        : 'linear-gradient(135deg,#3a3870,#2d2a5a)';
      const sleepShadow = S.data.sleep ? '' : 'box-shadow:0 2px 12px rgba(149,128,255,0.2);';

      return `
        <header class="header">
          <div style="display:flex;justify-content:space-between;align-items:center;width:100%">
            <div style="width:40px"></div>
            <div style="text-align:center">
              <div class="date-label">${today.display}</div>
              <div class="subtitle">作業日報</div>
            </div>
            <button class="gear-btn" data-action="go-settings">⚙</button>
          </div>
        </header>

        <div class="sleep-row">
          <button class="sleep-btn" style="background:${wakeBg};${wakeShadow}" data-action="set-wake">
            <span style="font-size:20px">☀</span>
            <span style="font-size:13px;font-weight:600">起床</span>
            <span class="sleep-time">${fmtTimeDisplay(S.data.wakeUp)}</span>
          </button>
          <button class="sleep-btn" style="background:${sleepBg};${sleepShadow}" data-action="set-sleep">
            <span style="font-size:20px">🌙</span>
            <span style="font-size:13px;font-weight:600">就寝</span>
            <span class="sleep-time">${fmtTimeDisplay(S.data.sleep)}</span>
          </button>
          ${S.data.wakeUp && S.data.sleep
            ? `<div class="sleep-dur">睡眠 ${fmtDur(sleepDiff(S.data.sleep, S.data.wakeUp))}</div>`
            : ''}
        </div>

        ${summaryBarHtml}

        ${S.data.entries.length > 0 ? `
        <div style="display:flex;gap:8px;padding:12px 20px 0">
          <button class="tab ${mainTab === 'list' ? 'on' : ''}" style="flex:1" data-action="main-tab" data-tab="list">リスト</button>
          <button class="tab ${mainTab === 'timeline' ? 'on' : ''}" style="flex:1" data-action="main-tab" data-tab="timeline">タイムライン</button>
        </div>` : ''}

        ${mainTab === 'timeline' && S.data.entries.length > 0
          ? renderTimelineContent()
          : `<div class="list">${listHtml}</div>`}

        <div class="bottom-bar">
          <button class="export-btn" data-action="go-export">MD出力</button>
          <button class="add-btn" data-action="go-add">＋</button>
        </div>`;
    }

    // ─── Timeline Content ───
    function renderTimelineContent() {
      const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      const sorted = [...S.data.entries].sort((a, b) => a.start.localeCompare(b.start));

      // Visible range: round down to hour start, round up to hour end
      const rangeStartMin = Math.floor(Math.min(...sorted.map(e => toMin(e.start))) / 60) * 60;
      const rangeEndMin   = Math.ceil( Math.max(...sorted.map(e => {
        const em = toMin(e.end);
        return em <= toMin(e.start) ? em + 1440 : em; // handle midnight wrap
      })) / 60) * 60;

      const PX = 60; // pixels per hour
      const totalPx = ((rangeEndMin - rangeStartMin) / 60) * PX;

      // Hour / half-hour grid lines & labels
      let gridHtml = '';
      for (let m = rangeStartMin; m <= rangeEndMin; m += 30) {
        const top = ((m - rangeStartMin) / 60) * PX;
        const isMajor = m % 60 === 0;
        const hh = String(Math.floor(m / 60) % 24).padStart(2, '0');
        const mm = String(m % 60).padStart(2, '0');
        const label = isMajor ? `${hh}:${mm}` : `:${mm}`;
        gridHtml += `
          <div class="tl-row" style="top:${top}px">
            <div class="tl-label" style="font-size:${isMajor ? 11 : 10}px;font-weight:${isMajor ? 600 : 400};color:${isMajor ? '#8b949e' : '#444'}">${label}</div>
            <div class="tl-line" style="background:${isMajor ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.03)'}"></div>
          </div>`;
      }

      // Entry blocks — detect overlaps and assign columns
      // Build column assignments
      const cols = []; // each col is array of entries assigned to it
      sorted.forEach(e => {
        const es = toMin(e.start);
        const ee = toMin(e.end) <= es ? toMin(e.end) + 1440 : toMin(e.end);
        let placed = false;
        for (const col of cols) {
          const last = col[col.length - 1];
          const ls = toMin(last.start);
          const le = toMin(last.end) <= ls ? toMin(last.end) + 1440 : toMin(last.end);
          if (es >= le) { col.push(e); placed = true; break; }
        }
        if (!placed) cols.push([e]);
      });
      const numCols = cols.length;

      let blocksHtml = '';
      cols.forEach((col, ci) => {
        const colW = `calc((100% - 52px) / ${numCols})`;
        const colL = `calc(52px + (100% - 52px) / ${numCols} * ${ci})`;
        col.forEach(e => {
          const es = toMin(e.start);
          const ee = toMin(e.end) <= es ? toMin(e.end) + 1440 : toMin(e.end);
          const top    = ((es - rangeStartMin) / 60) * PX;
          const height = Math.max(((ee - es) / 60) * PX - 2, 18);
          const c = getCatColor(e.major);
          const oi = S.data.entries.indexOf(e);
          const label = e.content || e.minor;
          const showSub = height >= 34;
          blocksHtml += `
            <div class="tl-block"
              style="top:${top}px;height:${height}px;left:${colL};width:${colW};background:${c.accent};border-left:3px solid ${c.text}"
              data-action="edit-entry" data-idx="${oi}">
              <div class="tl-block-title" style="color:${c.text}">${escHtml(label)}</div>
              ${showSub ? `<div class="tl-block-sub">${escHtml(fmtTime(e.start))}–${escHtml(fmtTime(e.end))}</div>` : ''}
            </div>`;
        });
      });

      return `<div class="tl-wrap" style="height:${totalPx + 24}px">${gridHtml}${blocksHtml}</div>`;
    }

    // ─── View: Add / Edit ───
    function renderAdd() {
      const majors = Object.keys(S.cats);
      const curPresets = S.presets[F.major]?.[F.minor] || [];
      const isEdit = S.editIdx !== null;

      // Ask-add dialog
      if (F.askAdd) {
        return `
          <div style="padding:60px 20px;text-align:center">
            <div style="font-size:16px;margin-bottom:8px;line-height:1.6">
              「${escHtml(F.customVal.trim())}」を<br>
              <strong>${escHtml(F.major)}›${escHtml(F.minor)}</strong> の定型選択肢に追加しますか？
            </div>
            <div style="font-size:13px;color:#8b949e;margin-bottom:24px">次回からプルダウンで選択できます</div>
            <div style="display:flex;gap:12px;justify-content:center">
              <button class="save-btn" style="width:auto;padding:12px 24px;background:rgba(255,255,255,0.08)" data-action="do-save">追加しない</button>
              <button class="save-btn" style="width:auto;padding:12px 24px" data-action="do-save-add">追加して記録</button>
            </div>
          </div>`;
      }

      const canSave = !!(F.start && F.end);
      const durHtml = canSave
        ? `<div class="dur-display">${fmtDur(timeDiff(F.start, F.end))}</div>`
        : '';

      // Content area
      let contentHtml = '';
      if (curPresets.length > 0) {
        contentHtml += `
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="tab ${F.mode === 'preset' ? 'on' : ''}" data-action="content-mode" data-mode="preset">選択</button>
            <button class="tab ${F.mode === 'custom' ? 'on' : ''}" data-action="content-mode" data-mode="custom">その他</button>
          </div>`;
      }
      if (F.mode === 'preset' && curPresets.length > 0) {
        const opts = curPresets.map(p =>
          `<option value="${escAttr(p)}" ${p === F.presetVal ? 'selected' : ''}>${escHtml(p)}</option>`
        ).join('');
        contentHtml += `
          <select class="sel" name="presetVal">
            <option value="">（選択なし）</option>
            ${opts}
          </select>`;
      } else {
        contentHtml += `<textarea class="textarea" name="customVal" placeholder="作業内容を入力（任意）..." rows="2">${escHtml(F.customVal)}</textarea>`;
      }

      const startOpts = timeSlots.map(t =>
        `<option value="${t}" ${t === F.start ? 'selected' : ''}>${t}</option>`
      ).join('');
      const endOpts = `<option value="">--:--</option>` + endTimeSlots.map(t =>
        `<option value="${t}" ${t === F.end ? 'selected' : ''}>${fmtTime(t)}</option>`
      ).join('');
      const majorOpts = majors.map(c =>
        `<option value="${escAttr(c)}" ${c === F.major ? 'selected' : ''}>${escHtml(c)}</option>`
      ).join('');
      const minorOpts = (S.cats[F.major] || []).map(c =>
        `<option value="${escAttr(c)}" ${c === F.minor ? 'selected' : ''}>${escHtml(c)}</option>`
      ).join('');

      return `
        <header class="header row">
          <button class="back-btn" data-action="go-main">← 戻る</button>
          <span style="font-size:16px;font-weight:700">${isEdit ? '編集' : '作業追加'}</span>
          <div style="width:60px"></div>
        </header>

        <div class="form">
          <label class="label">時間</label>
          <div class="row">
            <select class="sel" name="start">${startOpts}</select>
            <span style="color:#aaa;font-size:18px">→</span>
            <select class="sel" name="end">${endOpts}</select>
          </div>
          ${durHtml}
        </div>

        <div class="form">
          <label class="label">カテゴリ</label>
          <div class="row">
            <select class="sel" name="major">${majorOpts}</select>
            <span style="color:#aaa;font-size:14px">▸</span>
            <select class="sel" name="minor">${minorOpts}</select>
          </div>
        </div>

        <div class="form">
          <label class="label">内容（任意）</label>
          ${contentHtml}
        </div>

        <button class="save-btn" data-action="save-entry" ${canSave ? '' : 'disabled'}>
          ${isEdit ? '更新' : '記録する'}
        </button>`;
    }

    // ─── View: Export ───
    function renderExport() {
      const sorted = [...S.data.entries].sort((a, b) => a.start.localeCompare(b.start));
      const summary = {};
      let total = 0;
      S.data.entries.forEach(e => {
        const d = timeDiff(e.start, e.end);
        summary[e.major] = (summary[e.major] || 0) + d;
        total += d;
      });

      let sl = '';
      if (S.data.wakeUp || S.data.sleep) {
        sl = '\n## 睡眠記録\n';
        if (S.data.wakeUp) sl += `- 起床：${S.data.wakeUp}\n`;
        if (S.data.sleep)  sl += `- 就寝：${S.data.sleep}\n`;
      }

      let tb = '\n## 作業記録\n\n| # | 開始 | 終了 | 大分類 | 小分類 | 内容 |\n|---|------|------|--------|--------|------|\n';
      sorted.forEach((e, i) => {
        tb += `| ${i + 1} | ${fmtTime(e.start)} | ${fmtTime(e.end)} | ${e.major} | ${e.minor} | ${e.content || ''} |\n`;
      });

      let sm = '\n## サマリー\n';
      Object.keys(S.cats).forEach(c => { sm += `- ${c}：${fmtDur(summary[c] || 0)}\n`; });
      sm += `- 合計記録時間：${fmtDur(total)}\n`;

      _exportMd = `# 作業日報 ${today.display}\n${sl}${tb}${sm}`;

      const shareBtn = navigator.share
        ? `<button class="save-btn" style="flex:1;background:linear-gradient(135deg,#5a3580,#3d2060)" data-action="share-md">共有</button>`
        : '';

      return `
        <header class="header row">
          <button class="back-btn" data-action="go-main">← 戻る</button>
          <span style="font-size:16px;font-weight:700">MD出力</span>
          <div style="width:60px"></div>
        </header>
        <pre class="preview">${escHtml(_exportMd)}</pre>
        <div style="display:flex;gap:12px;padding:0 20px 24px">
          <button id="copy-btn" class="save-btn" style="flex:1" data-action="copy-md">コピー</button>
          ${shareBtn}
        </div>`;
    }

    // ─── View: Settings ───
    function renderSettings() {
      const majors = Object.keys(S.cats);
      let tabContent = '';

      if (F.tab === 'cat') {
        let groups = '';
        Object.entries(S.cats).forEach(([maj, mins]) => {
          const chips = mins.map(m => `
            <span class="chip">${escHtml(m)}<button class="chip-x" data-action="del-minor" data-maj="${escAttr(maj)}" data-min="${escAttr(m)}">×</button></span>
          `).join('');

          const addArea = F.addMinTgt === maj
            ? `<div style="display:flex;gap:4px;align-items:center">
                 <input class="inline-in" name="newMinVal" value="${escAttr(F.newMinVal)}" placeholder="小分類名" data-ime="1" data-enter-action="add-minor" data-maj="${escAttr(maj)}" />
                 <button class="inline-btn" data-action="add-minor" data-maj="${escAttr(maj)}">追加</button>
                 <button class="inline-btn" style="color:#8b949e" data-action="cancel-add-minor">×</button>
               </div>`
            : `<button class="add-chip" data-action="show-add-minor" data-maj="${escAttr(maj)}">＋</button>`;

          groups += `
            <div class="group">
              <div class="group-head">
                <span style="font-weight:700;font-size:15px">${escHtml(maj)}</span>
                <button class="mini-btn" style="color:#f27066" data-action="del-major" data-maj="${escAttr(maj)}">削除</button>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
                ${chips}${addArea}
              </div>
            </div>`;
        });

        tabContent = `
          <div style="padding:16px 20px">
            ${groups}
            <div style="display:flex;gap:8px;margin-top:16px">
              <input class="inline-in" name="newMaj" value="${escAttr(F.newMaj)}" placeholder="新しい大分類" style="flex:1" data-ime="1" data-enter-action="add-major" />
              <button class="inline-btn" data-action="add-major">追加</button>
            </div>
          </div>`;
      } else {
        const pMajOpts = majors.map(c =>
          `<option value="${escAttr(c)}" ${c === F.pMaj ? 'selected' : ''}>${escHtml(c)}</option>`
        ).join('');
        const pMinOpts = (S.cats[F.pMaj] || []).map(c =>
          `<option value="${escAttr(c)}" ${c === F.pMin ? 'selected' : ''}>${escHtml(c)}</option>`
        ).join('');
        const presetChips = (S.presets[F.pMaj]?.[F.pMin] || []).map(p => `
          <span class="chip">${escHtml(p)}<button class="chip-x" data-action="del-preset" data-maj="${escAttr(F.pMaj)}" data-min="${escAttr(F.pMin)}" data-val="${escAttr(p)}">×</button></span>
        `).join('');

        tabContent = `
          <div style="padding:16px 20px">
            <div class="row">
              <select class="sel" name="pMaj">${pMajOpts}</select>
              <span style="color:#aaa">▸</span>
              <select class="sel" name="pMin">${pMinOpts}</select>
            </div>
            ${F.pMin ? `
              <div style="margin-top:16px">
                <div style="font-size:13px;color:#8b949e;margin-bottom:8px">${escHtml(F.pMaj)}›${escHtml(F.pMin)} の定型選択肢</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px">${presetChips}</div>
                <div style="display:flex;gap:8px;margin-top:12px">
                  <input class="inline-in" name="newPre" value="${escAttr(F.newPre)}" placeholder="新しい選択肢" style="flex:1" data-ime="1" data-enter-action="add-preset" />
                  <button class="inline-btn" data-action="add-preset">追加</button>
                </div>
              </div>
            ` : ''}
          </div>`;
      }

      return `
        <header class="header row">
          <button class="back-btn" data-action="go-main">← 戻る</button>
          <span style="font-size:16px;font-weight:700">設定</span>
          <div style="width:60px"></div>
        </header>
        <div style="display:flex;gap:8px;padding:12px 20px 0">
          <button class="tab ${F.tab === 'cat' ? 'on' : ''}" style="flex:1" data-action="settings-tab" data-tab="cat">カテゴリ</button>
          <button class="tab ${F.tab === 'pre' ? 'on' : ''}" style="flex:1" data-action="settings-tab" data-tab="pre">内容プリセット</button>
        </div>
        ${tabContent}`;
    }

    // ─── Global Event Delegation ───
    document.body.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const idx    = btn.dataset.idx !== undefined ? parseInt(btn.dataset.idx) : null;

      switch (action) {
        case 'go-add':
          S.editIdx = null; initFormAdd(); S.view = 'add'; render(); break;
        case 'go-export':
          S.view = 'export'; render(); break;
        case 'go-settings':
          initFormSettings(); S.view = 'settings'; render(); break;
        case 'go-main':
          S.view = 'main'; S.editIdx = null; render(); break;

        case 'set-wake':
          S.data.wakeUp = roundToQuarterDatetime(); persist(); render(); break;
        case 'set-sleep':
          S.data.sleep = roundToQuarterDatetime(); persist(); render(); break;

        case 'del-entry':
          S.data.entries.splice(idx, 1); persist(); render(); break;
        case 'edit-entry':
          S.editIdx = idx; initFormAdd(); S.view = 'add'; render(); break;
        case 'save-entry':
          handleSave(); break;

        case 'copy-md':  copyMd();  break;
        case 'share-md': shareMd(); break;
        case 'do-save':     doSave();        break;
        case 'do-save-add': doSaveAndAdd();  break;

        case 'main-tab':
          mainTab = btn.dataset.tab; render(); break;
        case 'content-mode':
          F.mode = btn.dataset.mode; render(); break;
        case 'settings-tab':
          F.tab = btn.dataset.tab; render(); break;

        case 'show-add-minor':
          F.addMinTgt = btn.dataset.maj; F.newMinVal = ''; render(); break;
        case 'cancel-add-minor':
          F.addMinTgt = null; render(); break;

        case 'add-major':  addMajor(); break;
        case 'add-minor':  addMinor(btn.dataset.maj); break;
        case 'del-major':  delMajor(btn.dataset.maj); break;
        case 'del-minor':  delMinor(btn.dataset.maj, btn.dataset.min); break;
        case 'add-preset': addPreset(); break;
        case 'del-preset': delPreset(btn.dataset.maj, btn.dataset.min, btn.dataset.val); break;
      }
    });

    document.body.addEventListener('change', e => {
      const { name, value } = e.target;
      if (!name) return;
      switch (name) {
        case 'start':    F.start = value; updateDurDisplay(); break;
        case 'end':      F.end = value;   updateDurDisplay(); break;
        case 'major':    F.major = value; F.minor = S.cats[value]?.[0] || ''; F.presetVal = ''; render(); break;
        case 'minor':    F.minor = value; F.presetVal = ''; render(); break;
        case 'presetVal': F.presetVal = value; break;
        case 'pMaj':     F.pMaj = value; F.pMin = S.cats[value]?.[0] || ''; render(); break;
        case 'pMin':     F.pMin = value; render(); break;
      }
    });

    document.body.addEventListener('input', e => {
      const { name, value } = e.target;
      if (!name) return;
      // Update form state without re-rendering (preserves focus/caret in text fields)
      switch (name) {
        case 'customVal': F.customVal = value; break;
        case 'newMaj':    F.newMaj    = value; break;
        case 'newMinVal': F.newMinVal = value; break;
        case 'newPre':    F.newPre    = value; break;
      }
    });

    function updateDurDisplay() {
      const el = document.querySelector('.dur-display');
      if (!el) return;
      if (F.start && F.end) el.textContent = fmtDur(timeDiff(F.start, F.end));
    }

    // ─── Business Logic ───
    function handleSave() {
      if (!F.start || !F.end) return;
      const customVal = F.customVal.trim();
      const curPresets = S.presets[F.major]?.[F.minor] || [];
      if (F.mode === 'custom' && customVal && !curPresets.includes(customVal)) {
        F.askAdd = true; render(); return;
      }
      doSave();
    }

    function doSave() {
      const content = F.mode === 'preset' ? F.presetVal : F.customVal.trim();
      const entry = { start: F.start, end: F.end, major: F.major, minor: F.minor, content };
      if (S.editIdx !== null) {
        S.data.entries[S.editIdx] = entry;
        S.editIdx = null;
      } else {
        S.data.entries.push(entry);
      }
      persist(); S.view = 'main'; render();
    }

    function doSaveAndAdd() {
      const val = F.customVal.trim();
      if (!S.presets[F.major]) S.presets[F.major] = {};
      if (!S.presets[F.major][F.minor]) S.presets[F.major][F.minor] = [];
      if (!S.presets[F.major][F.minor].includes(val)) S.presets[F.major][F.minor].push(val);
      doSave();
    }

    async function copyMd() {
      try {
        await navigator.clipboard.writeText(_exportMd);
      } catch {
        const t = document.createElement('textarea');
        t.value = _exportMd;
        document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
      }
      const btn = document.getElementById('copy-btn');
      if (btn) {
        const orig = [btn.textContent, btn.style.background];
        btn.textContent = '✓ コピー済み';
        btn.style.background = 'linear-gradient(135deg,#2d7050,#1a5a38)';
        setTimeout(() => { btn.textContent = orig[0]; btn.style.background = orig[1]; }, 2000);
      }
    }

    async function shareMd() {
      if (!navigator.share) return;
      try {
        await navigator.share({
          files: [new File([new Blob([_exportMd], { type: 'text/markdown' })],
            `作業日報_${today.key}.md`, { type: 'text/markdown' })],
          title: `作業日報 ${today.display}`,
        });
      } catch {}
    }

    // ─── Settings Actions ───
    function addMajor() {
      const v = (F.newMaj || '').trim();
      if (!v || S.cats[v]) return;
      S.cats[v] = []; F.newMaj = ''; persist(); render();
    }

    function addMinor(maj) {
      const v = (F.newMinVal || '').trim();
      if (!v || (S.cats[maj] || []).includes(v)) return;
      if (!S.cats[maj]) S.cats[maj] = [];
      S.cats[maj].push(v); F.newMinVal = ''; F.addMinTgt = null; persist(); render();
    }

    function delMinor(maj, min) {
      S.cats[maj] = (S.cats[maj] || []).filter(m => m !== min);
      if (S.presets[maj]?.[min]) delete S.presets[maj][min];
      persist(); render();
    }

    function delMajor(maj) {
      delete S.cats[maj]; delete S.presets[maj]; persist(); render();
    }

    function addPreset() {
      const v = (F.newPre || '').trim();
      if (!v) return;
      if (!S.presets[F.pMaj]) S.presets[F.pMaj] = {};
      if (!S.presets[F.pMaj][F.pMin]) S.presets[F.pMaj][F.pMin] = [];
      if (!S.presets[F.pMaj][F.pMin].includes(v)) S.presets[F.pMaj][F.pMin].push(v);
      F.newPre = ''; persist(); render();
    }

    function delPreset(maj, min, val) {
      if (!S.presets[maj]?.[min]) return;
      S.presets[maj][min] = S.presets[maj][min].filter(p => p !== val);
      persist(); render();
    }

    // ─── Init ───
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
